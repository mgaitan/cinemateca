[project]
name = "cinemateca"
version = "0.3.0"
description = "Cinemateca personal con Google Drive y FastAPI"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "cryptography>=46,<49",
    "fastapi[standard]>=0.138,<1",
    "httpx>=0.28,<1",
    "imageio-ffmpeg>=0.6,<0.7",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.0,<3",
    "sqlalchemy-libsql>=0.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
